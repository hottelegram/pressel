<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Redirecionamento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: #f0f2f5;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    max-width: 480px;
    width: 100%;
    background: #ffffff;
    border-radius: 32px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    padding: 40px 28px 48px;
    text-align: center;
  }

  h2 {
    font-size: 26px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 12px;
  }

  .desc {
    font-size: 16px;
    line-height: 1.5;
    color: #4a4a4a;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-block;
    background: #0066ff;
    color: white;
    font-weight: 600;
    font-size: 18px;
    padding: 14px 32px;
    border-radius: 60px;
    text-decoration: none;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
  }

  .btn:hover {
    background: #0052cc;
    transform: scale(1.02);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .footer-note {
    margin-top: 28px;
    font-size: 12px;
    color: #888;
  }

  /* sem imagens, sem termos chamativos */
</style>
</head>
<body>

<div class="card">
  <h2>✔️ Verificação concluída</h2>
  <p class="desc">
    Seu acesso foi validado com sucesso.<br>
    Clique no botão abaixo para seguir para o próximo passo.
  </p>
  <a href="#" class="btn" id="nextStepBtn">Clique aqui para continuar →</a>
  <div class="footer-note">
    • Ambiente seguro • Verificação em tempo real •
  </div>
</div>

<script>
  // Apenas redireciona para o destino final (ex: site HOT ou link do Telegram)
  // O Facebook só vê esta página limpa. O clique é ação explícita do usuário.
  document.getElementById('nextStepBtn').addEventListener('click', function(e) {
    e.preventDefault();
    // Substitua pelo seu link real (site com conteúdo ou Telegram)
    window.location.href = 'https://seu-link-destino.com';
  });
</script>
</body>
</html>
