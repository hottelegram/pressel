<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Verificação de Acesso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #121212;  /* fundo escuro estilo TikTok */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container central - estilo TikTok */
    .tt-card {
      max-width: 500px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    /* Cabeçalho estilo TikTok */
    .tt-header {
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      padding: 24px 24px;
      text-align: center;
      border-bottom: 1px solid #2a2a2a;
    }

    /* Logo do TikTok */
    .tt-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ffffff;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .tt-logo svg {
      width: 34px;
      height: 34px;
    }

    /* Corpo do card */
    .tt-body {
      padding: 36px 28px 40px;
      text-align: center;
    }

    .check-icon {
      background: linear-gradient(135deg, #00f2ea, #ff0050);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0, 242, 234, 0.3);
    }

    .check-icon svg {
      width: 38px;
      height: 38px;
      stroke: white;
      stroke-width: 2;
    }

    h2 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .desc {
      font-size: 16px;
      line-height: 1.5;
      color: #b0b0b0;
      margin-bottom: 32px;
    }

    /* Botão estilo TikTok */
    .tt-btn {
      display: inline-block;
      background: linear-gradient(135deg, #00f2ea, #ff0050);
      color: white;
      font-weight: 700;
      font-size: 17px;
      padding: 14px 28px;
      border-radius: 40px;
      text-decoration: none;
      width: 100%;
      max-width: 280px;
      text-align: center;
      transition: 0.2s;
      box-shadow: 0 4px 15px rgba(0, 242, 234, 0.3);
      border: none;
      cursor: pointer;
    }

    .tt-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(255, 0, 80, 0.4);
    }

    .tt-btn:active {
      transform: scale(0.98);
    }

    /* Rodapé */
    .tt-footer {
      background: #111111;
      padding: 14px 20px;
      text-align: center;
      font-size: 12px;
      color: #6c6c6c;
      border-top: 1px solid #262626;
    }

    /* Responsivo */
    @media (max-width: 520px) {
      .tt-body {
        padding: 28px 20px 32px;
      }
      h2 {
        font-size: 22px;
      }
      .desc {
        font-size: 14px;
      }
      .tt-btn {
        font-size: 16px;
        padding: 12px 20px;
      }
      .tt-header {
        padding: 18px 20px;
      }
      .tt-logo {
        font-size: 24px;
      }
      .tt-logo svg {
        width: 28px;
        height: 28px;
      }
      .check-icon {
        width: 60px;
        height: 60px;
      }
      .check-icon svg {
        width: 30px;
        height: 30px;
      }
    }

    @media (max-width: 420px) {
      .tt-body {
        padding: 24px 16px 28px;
      }
      .check-icon {
        width: 52px;
        height: 52px;
      }
      .check-icon svg {
        width: 26px;
        height: 26px;
      }
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="tt-card">
  <div class="tt-header">
    <div class="tt-logo">
      <!-- Logo TikTok SVG oficial -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 1.1.21V9.51a6.35 6.35 0 0 0-1.1-.09A6.3 6.3 0 0 0 5.06 15.6a6.3 6.3 0 0 0 6.32 6.32 6.3 6.3 0 0 0 6.32-6.32V9.51a7.46 7.46 0 0 0 4.3 1.42V7.51a4.83 4.83 0 0 1-2.41-.82z" fill="white"/>
      </svg>
      <span>TikTok</span>
    </div>
  </div>

  <div class="tt-body">
    <div class="check-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2>Verificação concluída</h2>
    <p class="desc">
      Seu acesso foi validado com sucesso.<br>
      Clique no botão abaixo para seguir para o próximo passo.
    </p>
    <a href="https://wa.me/5512982683037?text=Oii%2C%20queria%20saber%20mais%20do%20grupinho%20vip!" class="tt-btn" id="continueBtn">Continuar →</a>
  </div>
  <div class="tt-footer">
    🔒 Conexão segura • Verificação em tempo real
  </div>
</div>

<script>
  // Redirecionamento apenas no clique do usuário
  document.getElementById('continueBtn').addEventListener('click', function(e) {
    e.preventDefault();
    // ⚠️ SUBSTITUA PELO SEU LINK REAL (site Hot ou Telegram) APENAS NO ARQUIVO FINAL
    window.location.href = 'https://wa.me/5512982683037?text=Oii%2C%20queria%20saber%20mais%20do%20grupinho%20vip!';
  });
</script>
</body>
</html>
